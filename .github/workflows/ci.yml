name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run check:design
      - run: npm run check:notices
      - run: npm test
      - run: npm run build

  e2e-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Electron's package downloads its binary the first time it is used, not at install. The
      # tests start the app on several workers at once, which would race to download it.
      - name: Electron's binary
        run: node node_modules/electron/install.js
      - name: End-to-end tests
        timeout-minutes: 30
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-macos-results
          path: test-results
          if-no-files-found: ignore

  e2e-linux:
    # The release is for Linux too. Ubuntu 24.04 does not let Chromium's sandbox create user
    # namespaces, so it uses Electron's setuid helper instead, set up as a package install does.
    # The sandbox stays on: the app turns it on in every build, and Chromium does not start without
    # a usable one, so a passing run is a run with the sandbox.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Electron's package downloads its binary the first time it is used, not at install. The
      # tests start the app on several workers at once, which would race to download it.
      - name: Electron's binary
        run: node node_modules/electron/install.js
      - name: Give Chromium's sandbox helper to root, with the setuid bit
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: A virtual display, larger than the app's least window size
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # The test windows are shown without the focus on Linux (see createMainWindow), so they draw
      # at full speed on the virtual display and do not take the focus from each other.
      - name: End-to-end tests
        timeout-minutes: 30
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-linux-results
          path: test-results
          if-no-files-found: ignore

  windows:
    # Windows is being added (no release for it yet): the unit tests and the end-to-end tests run
    # on a Windows runner, which has a desktop to draw the windows on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # Electron's package downloads its binary the first time it is used, not at install. The
      # tests start the app on several workers at once, which would race to download it.
      - name: Electron's binary
        run: node node_modules/electron/install.js
      - name: End-to-end tests
        timeout-minutes: 30
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-windows-results
          path: test-results
          if-no-files-found: ignore
