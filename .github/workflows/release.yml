name: Release

# Pushing a tag such as v0.9.0 builds the macOS (Apple Silicon and Intel), Linux and Windows
# packages and attaches them, with their checksums, to a draft release. The release stays a draft
# until the maintainer reads it and publishes it. Nothing is signed beyond macOS's ad hoc
# signature, and nothing is notarized (see electron-builder.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  TYPST_VERSION: 0.15.1

jobs:
  tag:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag names the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME, but package.json says $version." >&2
            exit 1
          fi
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    name: Build for ${{ matrix.name }}
    needs: tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-latest
            script: package
            java-arch: aarch64
            typst-target: aarch64-apple-darwin
            typst-sha256: 48f62ed034aa3a7978309579ac6ca00045e2ef0da73114e8af27cfd8e74dc05a
            files: dist/Ezetta-*-arm64.dmg
          - name: macOS (Intel)
            runner: macos-15-intel
            script: package:mac-x64
            java-arch: x64
            typst-target: x86_64-apple-darwin
            typst-sha256: 7f9fdd9584866245de9a79e0add8f9236fae6f40a8a45e2c4771ccc14db4e0fa
            files: dist/Ezetta-*-x64.dmg
          - name: Linux (x64)
            runner: ubuntu-24.04
            script: package:linux
            java-arch: x64
            typst-target: x86_64-unknown-linux-musl
            typst-sha256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
            files: dist/Ezetta-*.AppImage
          - name: Windows (x64)
            runner: windows-latest
            script: package:win
            java-arch: x64
            typst-target: x86_64-pc-windows-msvc
            typst-sha256: 19ce3551153c2fe7ee9fa2f95208310c8f4d3209fedb699e0333faf8913f6736
            files: dist/Ezetta-Setup-*-x64.exe
    # Git's bash on Windows, so the steps read the same on every runner.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Java runtime that ships with the app is trimmed from this JDK (scripts/package-resources.mjs).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          architecture: ${{ matrix.java-arch }}
      - name: Typst ${{ env.TYPST_VERSION }}, checked against its published checksum
        run: |
          # Windows gets a zip with typst.exe, the others a tar.xz with typst.
          ext=tar.xz bin=typst
          case "${{ matrix.typst-target }}" in *windows*) ext=zip bin=typst.exe ;; esac
          url="https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-${{ matrix.typst-target }}.$ext"
          curl -fsSL -o "typst.$ext" "$url"
          if command -v sha256sum >/dev/null; then sum=sha256sum; else sum='shasum -a 256'; fi
          echo "${{ matrix.typst-sha256 }}  typst.$ext" | $sum -c -
          mkdir typst-bin
          if [ "$ext" = zip ]; then unzip -q -j typst.zip '*/typst.exe' -d typst-bin
          else tar -xJf typst.tar.xz -C typst-bin --strip-components=1; fi
          # Node on Windows needs a Windows path (D:/a/...), not the shell's /d/a/...
          dir="$PWD"
          if command -v cygpath >/dev/null; then dir="$(cygpath -m "$PWD")"; fi
          echo "EZETTA_TYPST=$dir/typst-bin/$bin" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .dev
          key: dev-data-${{ runner.os }}-${{ hashFiles('scripts/fetch-dev-data.sh') }}
      - run: npm ci
      # Called directly: npm would run it through cmd.exe on Windows.
      - run: sh scripts/fetch-dev-data.sh
      - name: Package
        env:
          EZETTA_JDK: ${{ env.JAVA_HOME }}
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.typst-target }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        working-directory: packages
        run: sha256sum Ezetta-* | tee SHA256SUMS.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A version below 1.0, or one with a suffix such as -rc.1, is a pre-release.
          case "$GITHUB_REF_NAME" in v0.* | *-*) pre=--prerelease ;; *) pre= ;; esac
          cat > notes.md <<'EOF'
          ## Installing

          **macOS.** Open the dmg and drag Ezetta to Applications. The app is not notarized, so the first time, open System Settings, Privacy & Security, and choose Open Anyway (details in the README).

          **Linux.** Make the AppImage executable (`chmod +x Ezetta-*.AppImage`) and run it.

          **Windows.** Run `Ezetta-Setup-*-x64.exe`; it installs for your user account, without administrator rights. The installer is not signed, so Windows SmartScreen warns the first time: choose More info, then Run anyway.

          Formulas, spelling and grammar, synonyms and the export work out of the box. Verify a download with `SHA256SUMS.txt`.
          EOF
          gh release create "$GITHUB_REF_NAME" packages/* \
            --draft --verify-tag $pre \
            --title "Ezetta ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
