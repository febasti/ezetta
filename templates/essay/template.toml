# A small-format essay: A5 pages, centred headings with a short ornamental rule, no numbers, indented paragraphs, page numbers between dashes.
# The engine (`templates/engine.typ`) holds no visual values: they are in `style.toml`, per element.

[template]
id = "essay"
name = { de = "Essay", en = "Essay" }
description = { de = "Kleines Format (A5) mit zentrierten Überschriften, Zierlinie und Einzug statt Absatzabstand.", en = "Small format (A5) with centred headings, an ornamental rule and indented paragraphs." }
engine = 2

# The line spacing of the whole document: a factor of single spacing (1.2 times the size of the
# type), which the writer can change in "Dokument einrichten".
[[options]]
id = "line_height"
type = "number"
default = 1.09
min = 1
max = 3
label = { de = "Zeilenabstand", en = "Line spacing" }

[[options]]
id = "title_page"
type = "bool"
default = false
label = { de = "Titelseite", en = "Title page" }

[[options]]
id = "contents"
type = "bool"
default = false
label = { de = "Inhaltsverzeichnis", en = "Table of contents" }

[[options]]
id = "list_of_figures"
type = "bool"
default = false
label = { de = "Abbildungsverzeichnis", en = "List of figures" }

[[options]]
id = "list_of_tables"
type = "bool"
default = false
label = { de = "Tabellenverzeichnis", en = "List of tables" }
