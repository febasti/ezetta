# A book-style monograph or thesis: facing pages with mirrored running heads, chapters on new pages with a short rule and the word "Kapitel", a burgundy accent, small-caps section headings, indented paragraphs and a title page.
# The engine (`templates/engine.typ`) holds no visual values: they are in `style.toml`, per element.

[template]
id = "monographie"
name = { de = "Monographie", en = "Monograph" }
description = { de = "Buchsatz für Monographie und Abschlussarbeit: Doppelseiten mit wechselnden Kopfzeilen, Kapitel auf neuer Seite, Kapitälchen.", en = "Book setting for a monograph or thesis: facing pages with running heads, chapters on a new page, small caps." }
engine = 2

# The line spacing of the whole document: a factor of single spacing (1.2 times the size of the
# type), which the writer can change in "Dokument einrichten".
[[options]]
id = "line_height"
type = "number"
default = 1.13
min = 1
max = 3
label = { de = "Zeilenabstand", en = "Line spacing" }

[[options]]
id = "title_page"
type = "bool"
default = true
label = { de = "Titelseite", en = "Title page" }

[[options]]
id = "contents"
type = "bool"
default = true
label = { de = "Inhaltsverzeichnis", en = "Table of contents" }

[[options]]
id = "list_of_figures"
type = "bool"
default = false
label = { de = "Abbildungsverzeichnis", en = "List of figures" }

[[options]]
id = "list_of_tables"
type = "bool"
default = false
label = { de = "Tabellenverzeichnis", en = "List of tables" }

[[options]]
id = "chapter_new_page"
type = "bool"
default = true
label = { de = "Kapitel auf neuer Seite", en = "Chapters on a new page" }
