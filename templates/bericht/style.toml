# Technical report: teal headings in a monospaced face with a rule under each chapter title, boxed
# quotes and code, tinted tables, and a footer with the title over a coloured hairline. What an
# element does not set comes from the element it belongs to or from the engine's own default (see
# `src/core/export/elements.ts`).
engine = 2

[element.palette]
accent = "#0b6e6a"
accent_secondary = "#5f6b6a"

[element.page]
paper = "a4"
facing = "single"
margin_top = "2.6cm"
margin_bottom = "2.8cm"
margin_inside = "2.8cm"
margin_outside = "2.4cm"

[element.body]
font = "New Computer Modern"
size = "10.5pt"
justify = true
hyphenate = true
line_spacing = "0.7em"
line_spacing_wide = "1.05em"
paragraph_spacing = "0.9em"

[element.code]
font = "DejaVu Sans Mono"
size = "0.85em"
fill = "#f1f4f4"
padding = "0.7em"
radius = "3pt"

[element.footer]
size = "0.82em"
color = "accent_secondary"
slot_left = "title"
slot_center = "none"
slot_right = "page"
divider = true
divider_color = "accent"
divider_thickness = "0.6pt"
divider_gap = "0.6em"

[element.heading]
font = "DejaVu Sans Mono"
weight = "bold"
color = "accent"
number_depth = "3"
number_style = "hanging"
number_gap = "0.8em"

[element.heading_1]
size = "1.45em"
above = "0em"
below = "1.6em"
break_before = "page"
line_below = true
line_below_color = "accent"
line_below_thickness = "1.5pt"
line_below_width = "100%"
line_below_distance = "0.6em"

[element.heading_2]
size = "1.15em"
above = "1.9em"
below = "0.8em"

[element.heading_3]
size = "1em"
color = "accent_secondary"
above = "1.5em"
below = "0.6em"

[element.heading_4]
size = "1em"
weight = "regular"
italic = true
color = "accent_secondary"
above = "1.2em"
below = "0.5em"

[element.list]
marker = "square"
item_spacing = "0.4em"

[element.quote]
size = "0.95em"
indent_left = "0em"
indent_right = "0em"
above = "1.1em"
below = "1.1em"
fill = "#f1f4f4"
padding = "0.7em"
bar = true
bar_color = "accent"
bar_thickness = "3pt"
bar_gap = "0.9em"

[element.epigraph]
width = "65%"

[element.figure]
above = "1em"
below = "1em"

[element.figure_caption]
size = "0.88em"
color = "accent_secondary"
caption_separator = "dash"

[element.table]
border_style = "rows"
size = "0.95em"
inset = "0.6em"
rule_width = "0.4pt"
rule_strong_width = "0.8pt"
header_bold = true
header_fill = "#d3e9e7"
stripe_fill = "#f1f7f6"

[element.table_caption]
caption_position = "above"
color = "accent_secondary"
caption_separator = "dash"

[element.footnote]
size = "0.85em"
rule_width = "0.4pt"

[element.contents]
show_depth = "3"
chapter_weight = "bold"
indent = "1.4em"

[element.bibliography]
hanging_indent = "1.5em"
entry_spacing = "0.4em"

[element.link]
color = "accent"

[element.references]
color = "accent"

[element.citations]
color = "accent"

[element.highlight]
fill = "#ffe680"

[element.title_page]
space_above = "6cm"

[element.title_page_title]
font = "DejaVu Sans Mono"
size = "2.2em"
align = "left"
color = "accent"

[element.title_page_subtitle]
size = "1.2em"
align = "left"
color = "accent_secondary"
above = "1em"

[element.title_page_author]
size = "1.1em"
align = "left"
above = "4em"

[element.title_page_date]
size = "0.9em"
align = "left"
color = "accent_secondary"
above = "0.8em"
