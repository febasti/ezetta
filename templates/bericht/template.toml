# A technical report in colour: teal headings with a rule, tinted tables, boxed quotes and code, numbered chapters, a footer with the title.
# The engine (`templates/engine.typ`) holds no visual values: they are in `style.toml`, per element.

[template]
id = "bericht"
name = { de = "Technischer Bericht", en = "Technical report" }
description = { de = "Farbiger Bericht mit Akzentfarbe, abgesetzten Zitaten und Code, getönten Tabellen.", en = "Coloured report with an accent colour, boxed quotes and code, and tinted tables." }
engine = 2

[[options]]
id = "author"
type = "text"
default = ""
label = { de = "Autorin oder Autor", en = "Author" }

[[options]]
id = "subtitle"
type = "text"
default = ""
label = { de = "Untertitel", en = "Subtitle" }

[[options]]
id = "line_spacing"
type = "enum"
default = "normal"
label = { de = "Zeilenabstand", en = "Line spacing" }
values = [
  { id = "normal", label = { de = "Normal", en = "Normal" } },
  { id = "wide", label = { de = "Weit (1,5-fach)", en = "Wide (1.5)" } },
]

[[options]]
id = "title_page"
type = "bool"
default = true
label = { de = "Titelseite", en = "Title page" }

[[options]]
id = "contents"
type = "bool"
default = true
label = { de = "Inhaltsverzeichnis", en = "Table of contents" }

[[options]]
id = "list_of_figures"
type = "bool"
default = true
label = { de = "Abbildungsverzeichnis", en = "List of figures" }

[[options]]
id = "list_of_tables"
type = "bool"
default = true
label = { de = "Tabellenverzeichnis", en = "List of tables" }

[[options]]
id = "chapter_new_page"
type = "bool"
default = true
label = { de = "Kapitel auf neuer Seite", en = "Chapters on a new page" }
