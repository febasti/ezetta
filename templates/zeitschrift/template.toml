# A journal article in two columns: compact, justified, with the contents off, figures that may span both columns and three-rule tables.
# The engine (`templates/engine.typ`) holds no visual values: they are in `style.toml`, per element.

[template]
id = "zeitschrift"
name = { de = "Zeitschrift", en = "Journal" }
description = { de = "Zweispaltiger Aufsatz im Stil einer Fachzeitschrift, mit Kopfzeile und Dreilinientabellen.", en = "Two-column journal article with a running head and three-rule tables." }
engine = 2

# The line spacing of the whole document: a factor of single spacing (1.2 times the size of the
# type), which the writer can change in "Dokument einrichten".
[[options]]
id = "line_height"
type = "number"
default = 1.03
min = 1
max = 3
label = { de = "Zeilenabstand", en = "Line spacing" }

[[options]]
id = "title_page"
type = "bool"
default = false
label = { de = "Titelseite", en = "Title page" }

[[options]]
id = "contents"
type = "bool"
default = false
label = { de = "Inhaltsverzeichnis", en = "Table of contents" }

[[options]]
id = "list_of_figures"
type = "bool"
default = false
label = { de = "Abbildungsverzeichnis", en = "List of figures" }

[[options]]
id = "list_of_tables"
type = "bool"
default = false
label = { de = "Tabellenverzeichnis", en = "List of tables" }
