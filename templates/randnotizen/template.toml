# Tufte style: a wide column of text with the footnotes in the outer margin beside the line they belong to, italic headings, no numbers.
# The engine (`templates/engine.typ`) holds no visual values: they are in `style.toml`, per element.

[template]
id = "randnotizen"
name = { de = "Randnotizen", en = "Margin notes" }
description = { de = "Schmale Textspalte mit Fußnoten als Randnotizen neben dem Text (Tufte-Stil).", en = "Narrow text column with footnotes as margin notes beside the text (Tufte style)." }
engine = 2

# The line spacing of the whole document: a factor of single spacing (1.2 times the size of the
# type), which the writer can change in "Dokument einrichten".
[[options]]
id = "line_height"
type = "number"
default = 1.22
min = 1
max = 3
label = { de = "Zeilenabstand", en = "Line spacing" }

[[options]]
id = "title_page"
type = "bool"
default = false
label = { de = "Titelseite", en = "Title page" }

[[options]]
id = "contents"
type = "bool"
default = false
label = { de = "Inhaltsverzeichnis", en = "Table of contents" }

[[options]]
id = "list_of_figures"
type = "bool"
default = false
label = { de = "Abbildungsverzeichnis", en = "List of figures" }

[[options]]
id = "list_of_tables"
type = "bool"
default = false
label = { de = "Tabellenverzeichnis", en = "List of tables" }
